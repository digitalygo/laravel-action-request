name: run-tests

on:
    push:
        branches: [main, alpha, beta]
    pull_request:
        branches: [main, alpha, beta]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4']
                laravel: ['^12.0', '^13.0']
                stability: [prefer-lowest, prefer-stable]
                include:
                    - laravel: '^12.0'
                      testbench: '^10.0'
                    - laravel: '^13.0'
                      testbench: '^11.0'

        name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

            - name: Setup PHP
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                  coverage: none

            - name: Setup problem matchers
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
            - name: Install dependencies
              run: |
                    composer update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --with-all-dependencies --${{ matrix.stability }} --prefer-dist --no-interaction --no-scripts --no-plugins

            - name: Audit dependencies
              run: composer audit --locked --no-interaction

            - name: Execute tests
              run: vendor/bin/pest
